<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAP – Snap Scroll Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }

    .header { text-align: center; }
    .header h1 { color: #111; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .header p  { color: #888; font-size: 12px; margin-top: 4px; }

    .stage { display: flex; align-items: center; gap: 20px; }

    /* ── Phone shell ── */
    .phone {
      position: relative;
      width: 360px;
      height: 780px;
      background: #fafafa;
      border-radius: 50px;
      overflow: hidden;
      border: 2px solid rgba(0,0,0,0.08);
      box-shadow:
        0 0 0 8px rgba(0,0,0,0.06),
        0 32px 80px rgba(0,0,0,0.22);
      flex-shrink: 0;
    }

    /* ── Status bar ── */
    .statusbar {
      position: absolute;
      top: 0; left: 0; right: 0; height: 44px;
      background: rgba(250,250,250,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .statusbar-time  { font-size: 13px; font-weight: 600; color: #111; }
    .statusbar-icons { font-size: 10px; color: #111; opacity: 0.55; display: flex; gap: 5px; }

    /* ── Scroll container — one continuous page ── */
    .scroll {
      position: absolute;
      inset: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      background: #fafafa;
      /* top padding pushes first section down so it centres in the visible area */
      padding-top: var(--peek);
      padding-bottom: var(--peek);
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }

    /* ── Each section slot — full width, no gap feel ── */
    .slot {
      width: 100%;
      height: var(--snap-step);
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }

    /* ── Section — looks like part of the page, not a card ── */
    .section {
      width: 100%;
      height: var(--section-h);
      overflow: hidden;
      position: relative;
      background: #fff;
      /* No border radius — these are page sections, not cards */
      /* Very subtle transition so active section feels "in focus" */
      transition: opacity 0.35s ease;
      will-change: opacity;
    }
    .section.inactive { opacity: 0.55; }
    .section.active   { opacity: 1; }

    .section img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* ── Divider line between sections (like a real page separator) ── */
    .divider {
      height: var(--gap);
      background: #f0f0f0;
      border-top: 1px solid rgba(0,0,0,0.06);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    /* ── Subtle white fades at top/bottom to hint at adjacent sections ── */
    .fade-top, .fade-bot {
      position: absolute; left: 0; right: 0;
      pointer-events: none; z-index: 10;
    }
    .fade-top {
      top: 44px; height: var(--peek);
      background: linear-gradient(to bottom, rgba(250,250,250,0.95) 0%, transparent 100%);
    }
    .fade-bot {
      bottom: 0; height: var(--peek);
      background: linear-gradient(to top, rgba(250,250,250,0.95) 0%, transparent 100%);
    }

    /* ── Sidebar dots ── */
    .dots {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .dot {
      width: 3px; border-radius: 3px;
      background: rgba(0,0,0,0.15);
      height: 4px; opacity: 0.5;
      transition:
        height     0.3s cubic-bezier(0.34,1.56,0.64,1),
        background 0.3s ease,
        opacity    0.3s ease;
    }
    .dot.active { height: 24px; opacity: 1; background: #C70255; }

    /* ── Section label below phone ── */
    .section-label {
      font-size: 12px; font-weight: 600;
      color: #555; letter-spacing: 0.04em;
      min-height: 18px; text-align: center;
      transition: color 0.3s ease;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>SLAP Home Page</h1>
  <p>Scroll inside the phone to move between sections ↕</p>
</div>

<div class="stage">
  <div class="phone">
    <div class="statusbar">
      <span class="statusbar-time">9:41</span>
      <div class="statusbar-icons"><span>▋▋▋</span><span>WiFi</span><span>⌁</span></div>
    </div>
    <div class="scroll" id="scroll"></div>
    <div class="fade-top"></div>
    <div class="fade-bot"></div>
  </div>
  <div class="dots" id="dots"></div>
</div>

<div class="section-label" id="section-label"></div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const PEEK_RATIO = 0.10;   // 10% peek — subtle, feels like one page
  const PHONE_H    = 780;
  const GAP        = 1;      // 1px — just a hairline divider between sections
  const PEEK       = Math.round(PHONE_H * PEEK_RATIO);
  const SECTION_H  = PHONE_H - PEEK * 2;
  const SNAP_STEP  = SECTION_H + GAP;

  const root = document.documentElement;
  root.style.setProperty('--peek',      PEEK      + 'px');
  root.style.setProperty('--section-h', SECTION_H + 'px');
  root.style.setProperty('--snap-step', SNAP_STEP + 'px');
  root.style.setProperty('--gap',       GAP       + 'px');

  // ── Sections — actual Figma screenshots ───────────────────────────────────
  const SECTIONS = [
    {
      name:   'Curated for you',
      img:    'https://www.figma.com/api/mcp/asset/c98abb65-172e-4095-893f-861470b302e5',
    },
    {
      name:   'Review Synthesizer',
      img:    'https://www.figma.com/api/mcp/asset/1e166fd7-deb2-451f-a04d-9f3eb52c0d46',
    },
    {
      name:   'Decoded Looks',
      img:    'https://www.figma.com/api/mcp/asset/37cb13a9-8f38-42aa-8ff8-d806b1a3e4a7',
    },
    {
      name:   'Product Compare',
      img:    'https://www.figma.com/api/mcp/asset/05badbaa-e040-4035-a1b7-efc1aed85d04',
    },
    {
      name:   'Deal Wall Alerts',
      img:    'https://www.figma.com/api/mcp/asset/857b6587-a33a-42a9-8b0d-bbf23ad53323',
    },
    {
      name:   'Complete Your Look',
      img:    'https://www.figma.com/api/mcp/asset/0d792c5e-f5c3-4941-b61e-592834a3c774',
    },
    {
      name:   'Occasion',
      img:    'https://www.figma.com/api/mcp/asset/cb4ccb85-e739-40ea-99ab-142697fe85ff',
    },
    {
      name:   'Style Drop',
      img:    'https://www.figma.com/api/mcp/asset/8e6b1dbb-72c9-4bf0-86fc-caf8be8c2490',
    },
    {
      name:   'Help us know you',
      img:    'https://www.figma.com/api/mcp/asset/bb22c6f3-e745-4550-9080-fbd4d122d34f',
    },
  ];

  // ── Build DOM ─────────────────────────────────────────────────────────────
  const scrollEl = document.getElementById('scroll');
  const dotsEl   = document.getElementById('dots');
  const labelEl  = document.getElementById('section-label');

  SECTIONS.forEach((s, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';

    const section = document.createElement('div');
    section.className = 'section inactive';
    section.dataset.index = i;

    const img = document.createElement('img');
    img.src     = s.img;
    img.alt     = s.name;
    img.loading = i < 2 ? 'eager' : 'lazy';

    section.appendChild(img);
    slot.appendChild(section);

    // hairline divider between sections
    if (GAP > 0) {
      const div = document.createElement('div');
      div.className = 'divider';
      slot.appendChild(div);
    }

    scrollEl.appendChild(slot);

    // dot
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.dataset.index = i;
    dotsEl.appendChild(dot);
  });

  // ── Active tracking ───────────────────────────────────────────────────────
  let activeIndex = -1;

  function setActive(idx) {
    if (idx === activeIndex) return;
    activeIndex = idx;

    document.querySelectorAll('.section').forEach((s, i) => {
      s.classList.toggle('active',   i === idx);
      s.classList.toggle('inactive', i !== idx);
    });

    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === idx);
    });

    labelEl.textContent = SECTIONS[idx].name;
  }

  const observer = new IntersectionObserver(
    entries => {
      entries.forEach(e => {
        if (e.isIntersecting && e.intersectionRatio >= 0.55) {
          setActive(Number(e.target.dataset.index));
        }
      });
    },
    { root: scrollEl, threshold: 0.55 }
  );

  document.querySelectorAll('.section').forEach(s => observer.observe(s));
  setActive(0);
</script>
</body>
</html>
