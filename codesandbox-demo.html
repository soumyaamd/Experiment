<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAP – Snap Scroll Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px 20px;
    }

    /* ── Header ── */
    .header { text-align: center; }
    .header h1 { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .header p  { color: rgba(255,255,255,0.3); font-size: 12px; margin-top: 4px; }

    /* ── Phone + dots row ── */
    .stage { display: flex; align-items: center; gap: 20px; }

    /* ── Phone shell ── */
    .phone {
      position: relative;
      width: 360px;
      height: 780px;
      background: #111;
      border-radius: 48px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.10);
      box-shadow: 0 0 0 8px #1a1a1a, 0 40px 80px rgba(0,0,0,0.7);
      flex-shrink: 0;
    }

    /* ── Status bar ── */
    .statusbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .statusbar-icons { display: flex; gap: 6px; font-size: 10px; opacity: 0.8; }

    /* ── Scroll container ── */
    .scroll {
      position: absolute;
      inset: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      /* PEEK: push first/last item so they centre */
      padding-top:  var(--peek);
      padding-bottom: var(--peek);
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }

    /* ── Each snap slot ── */
    .slot {
      height: var(--snap-step);
      padding-bottom: var(--gap);
      padding-left: 12px;
      padding-right: 12px;
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      height: var(--section-h);
      border-radius: 24px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      position: relative;
      border: 1.5px solid rgba(255,255,255,0.07);
      /* GPU-only transitions */
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1),
                  opacity  0.35s cubic-bezier(0.22,1,0.36,1),
                  border-color 0.35s ease;
      will-change: transform, opacity;
    }
    .card.inactive {
      transform: scale(0.94);
      opacity: 0.42;
    }
    .card.active {
      transform: scale(1);
      opacity: 1;
    }

    /* ── Glow blob ── */
    .glow {
      position: absolute;
      top: -70px; right: -70px;
      width: 220px; height: 220px;
      border-radius: 50%;
      filter: blur(64px);
      pointer-events: none;
      opacity: 0.05;
      transition: opacity 0.4s ease;
    }
    .card.active .glow {
      opacity: 0.16;
      animation: pulse 3.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 0.14; }
      50%       { transform: scale(1.15); opacity: 0.22; }
    }

    /* ── Card content ── */
    .tag {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22,1,0.36,1);
    }
    .icon {
      font-size: 44px; line-height: 1; margin-top: 4px;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.35s 0.07s ease, transform 0.35s 0.07s cubic-bezier(0.22,1,0.36,1);
    }
    .title {
      font-size: 28px; font-weight: 800; color: #fff; line-height: 1.15; margin-top: 4px;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.35s 0.14s ease, transform 0.35s 0.14s cubic-bezier(0.22,1,0.36,1);
    }
    .subtitle {
      font-size: 13px; color: rgba(255,255,255,0.52); line-height: 1.65; max-width: 256px;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.35s 0.21s ease, transform 0.35s 0.21s cubic-bezier(0.22,1,0.36,1);
    }
    .cta-wrap {
      margin-top: auto;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.35s 0.28s ease, transform 0.35s 0.28s cubic-bezier(0.22,1,0.36,1);
    }
    .cta {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 100px; padding: 10px 20px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border-width: 1px; border-style: solid;
      background: transparent;
      transition: transform 0.15s ease;
    }
    .cta:hover  { transform: scale(1.04); }
    .cta:active { transform: scale(0.97); }

    /* Stagger-in when active */
    .card.active .tag,
    .card.active .icon,
    .card.active .title,
    .card.active .subtitle,
    .card.active .cta-wrap {
      opacity: 1;
      transform: translateY(0);
    }

    .counter-chip {
      position: absolute; bottom: 20px; right: 20px;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
      border-radius: 100px; padding: 3px 10px;
      color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 600;
    }

    /* ── Edge fades ── */
    .fade-top, .fade-bot {
      position: absolute; left: 0; right: 0;
      pointer-events: none; z-index: 5;
    }
    .fade-top { top: 44px; height: var(--peek); background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); }
    .fade-bot { bottom: 0; height: var(--peek); background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%); }

    /* ── Sidebar dots ── */
    .dots {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .dot {
      width: 3px; border-radius: 4px;
      background: rgba(255,255,255,0.2);
      transition: height 0.25s cubic-bezier(0.34,1.56,0.64,1),
                  background 0.25s ease;
      height: 4px;
    }
    .dot.active { height: 22px; }

    /* ── Label below phone ── */
    .active-label {
      font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
      transition: color 0.3s ease;
      min-height: 20px;
    }

    /* ── Config hint ── */
    .hint {
      padding: 10px 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      max-width: 360px; width: 100%;
      color: rgba(255,255,255,0.35); font-size: 11px; line-height: 1.7;
    }
    .hint strong { color: rgba(255,255,255,0.6); }
    .hint code   { color: #6C63FF; }
  </style>
</head>
<body>

<div class="header">
  <h1>SLAP Home</h1>
  <p>Snap-scroll demo · scroll inside the phone</p>
</div>

<div class="stage">
  <div class="phone" id="phone">
    <div class="statusbar">
      <span>9:41</span>
      <div class="statusbar-icons"><span>▋▋▋</span><span>〇</span><span>⌁</span></div>
    </div>
    <div class="scroll" id="scroll"></div>
    <div class="fade-top"></div>
    <div class="fade-bot"></div>
  </div>
  <div class="dots" id="dots"></div>
</div>

<div class="active-label" id="active-label"></div>

<div class="hint">
  <strong>Tune peek →</strong>
  Change <code>PEEK_RATIO</code> at the top of the &lt;script&gt; tag ·
  0.08 subtle · <strong style="color:#fff">0.12 default</strong> · 0.18 large
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────
  const PEEK_RATIO  = 0.12;   // ← tune this: 0.08 subtle | 0.12 default | 0.18 large
  const PHONE_H     = 780;
  const GAP         = 8;
  const PEEK        = Math.round(PHONE_H * PEEK_RATIO);
  const SECTION_H   = PHONE_H - PEEK * 2;
  const SNAP_STEP   = SECTION_H + GAP;

  // Expose values as CSS custom properties so CSS can use them.
  document.documentElement.style.setProperty('--peek',      PEEK      + 'px');
  document.documentElement.style.setProperty('--section-h', SECTION_H + 'px');
  document.documentElement.style.setProperty('--snap-step', SNAP_STEP + 'px');
  document.documentElement.style.setProperty('--gap',       GAP       + 'px');

  // ── Data ─────────────────────────────────────────────────────────────────
  const SECTIONS = [
    { tag:'Personalised feed', title:'Curated for you',      subtitle:'Personalises on every scroll — the more you explore, the smarter it gets.', accent:'#6C63FF', bg:'linear-gradient(160deg,#1a1a3e,#0f0f2d)', icon:'✦' },
    { tag:'AI Summary',        title:'Review Synthesizer',   subtitle:'Thousands of reviews distilled into one clear, honest verdict.',              accent:'#00C9A7', bg:'linear-gradient(160deg,#0d2b25,#061a16)', icon:'◎' },
    { tag:'Style',             title:'Decoded Looks',        subtitle:'Shop the exact look — head to toe — in one tap.',                             accent:'#FF6584', bg:'linear-gradient(160deg,#2b1020,#1a0a14)', icon:'◈' },
    { tag:'Smart compare',     title:'Product Compare',      subtitle:'Side-by-side specs, price and verdict — no tab-hopping required.',            accent:'#F9A825', bg:'linear-gradient(160deg,#261c04,#180f00)', icon:'⊞' },
    { tag:'Deals',             title:'Deal Wall Alerts',     subtitle:'ACs under ₹35k, compared for you — updated live.',                           accent:'#E94560', bg:'linear-gradient(160deg,#2b0a12,#1a040c)', icon:'↓' },
    { tag:'Outfit builder',    title:'Complete Your Look',   subtitle:'Accessories and layers that pair perfectly with what you picked.',            accent:'#7C4DFF', bg:'linear-gradient(160deg,#17102b,#0e091a)', icon:'◇' },
    { tag:'Context',           title:'Occasion',             subtitle:'Dress for the moment — beach, boardroom, or back-to-college.',                accent:'#26C6DA', bg:'linear-gradient(160deg,#062228,#031418)', icon:'◉' },
    { tag:'Visual discovery',  title:'Style Drop',           subtitle:'Find apparel by visual attributes — auto tried on your body type.',          accent:'#FF8F00', bg:'linear-gradient(160deg,#261500,#180d00)', icon:'⬡' },
    { tag:'Personalisation',   title:'Help us know you',     subtitle:'Your preferences are never shared — only used to sharpen SLAP for you.',     accent:'#9C89B8', bg:'linear-gradient(160deg,#1a1220,#100b16)', icon:'◐' },
    { tag:'Ask anything',      title:'Ask SLAP',             subtitle:'Suggest me a chair for back pain under ₹8,000…',                             accent:'#F0A500', bg:'linear-gradient(160deg,#261c00,#181100)', icon:'◑' },
  ];

  // ── Build DOM ─────────────────────────────────────────────────────────────
  const scrollEl = document.getElementById('scroll');
  const dotsEl   = document.getElementById('dots');
  const labelEl  = document.getElementById('active-label');
  const total    = SECTIONS.length;

  SECTIONS.forEach((s, i) => {
    // Slot
    const slot = document.createElement('div');
    slot.className = 'slot';

    // Card
    const card = document.createElement('div');
    card.className = 'card inactive';
    card.dataset.index = i;
    card.style.background = s.bg;

    // Glow
    const glow = document.createElement('div');
    glow.className = 'glow';
    glow.style.background = s.accent;

    // Content
    const tag      = el('div', 'tag',      s.tag,      { color: s.accent });
    const icon     = el('div', 'icon',     s.icon,     { color: s.accent });
    const title    = el('div', 'title',    s.title,    {});
    const subtitle = el('div', 'subtitle', s.subtitle, {});

    const ctaWrap = document.createElement('div');
    ctaWrap.className = 'cta-wrap';
    const cta = document.createElement('button');
    cta.className = 'cta';
    cta.textContent = 'Explore →';
    cta.style.color       = s.accent;
    cta.style.borderColor = s.accent + '55';
    cta.style.background  = s.accent + '22';
    ctaWrap.appendChild(cta);

    const chip = document.createElement('div');
    chip.className = 'counter-chip';
    chip.textContent = (i + 1) + '/' + total;

    card.append(glow, tag, icon, title, subtitle, ctaWrap, chip);
    slot.appendChild(card);
    scrollEl.appendChild(slot);

    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.dataset.index = i;
    dotsEl.appendChild(dot);
  });

  function el(tag, cls, text, styles) {
    const node = document.createElement(tag);
    node.className = cls;
    node.textContent = text;
    Object.assign(node.style, styles);
    return node;
  }

  // ── Active section tracking via IntersectionObserver ─────────────────────
  let activeIndex = -1;

  function setActive(idx) {
    if (idx === activeIndex) return;
    activeIndex = idx;
    const s = SECTIONS[idx];

    // Cards
    document.querySelectorAll('.card').forEach((c, i) => {
      c.classList.toggle('active',   i === idx);
      c.classList.toggle('inactive', i !== idx);
    });

    // Dots
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === idx);
      d.style.background = i === idx ? s.accent : 'rgba(255,255,255,0.2)';
    });

    // Label
    labelEl.textContent = s.title;
    labelEl.style.color = s.accent;
  }

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
          setActive(Number(entry.target.dataset.index));
        }
      });
    },
    { root: scrollEl, threshold: 0.6 }
  );

  document.querySelectorAll('.card').forEach(c => observer.observe(c));

  // Activate first section on load.
  setActive(0);
</script>
</body>
</html>
